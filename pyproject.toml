[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # line length — GUI strings are long
  "B008",  # function calls in defaults — tkinter patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
