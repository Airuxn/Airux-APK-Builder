name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Compile check
        run: python -m py_compile apk_builder.py

      - name: Run tests
        run: pytest -q

      - name: Shell syntax and ShellCheck
        run: |
          for f in Start.sh scripts/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck Start.sh scripts/*.sh

      - name: Desktop entry sanity
        run: |
          test -f Airux-APK-Builder.desktop
          grep -q '^Exec=' Airux-APK-Builder.desktop
          grep -q '^Type=Application' Airux-APK-Builder.desktop
          bash scripts/install-desktop.sh /tmp/Airux-APK-Builder.desktop
          grep -q 'apk_builder.py' /tmp/Airux-APK-Builder.desktop
