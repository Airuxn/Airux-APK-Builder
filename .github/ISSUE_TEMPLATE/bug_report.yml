name: Bug report
description: Something is broken in Airux APK Builder
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include OS info and the exported build log when possible.

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 22.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.3
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.11.0
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ./Start.sh
        2. Select project …
        3. Click Build APK
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Build log excerpt (optional)
      description: Paste from the UI export or `.success.log` / `.failed.log`
      render: shell
